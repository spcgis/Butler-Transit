<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>Butler County Transit Map</title>
    <link rel="stylesheet" href="https://js.arcgis.com/5.1/esri/themes/light/main.css">
    <script type="module" src="https://js.arcgis.com/5.1/"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <arcgis-map id="map" basemap="gray-vector" center="-79.895233, 40.860796" zoom="10">
        <div slot="top-right" id="filterContainer"></div>
        <div id="sidePanel" slot="top-left"></div>
        <arcgis-expand slot="bottom-left" expanded>
            <arcgis-legend></arcgis-legend>
        </arcgis-expand>
    </arcgis-map>
    <script type="module" src="app.js"></script>
</body>
</html>
